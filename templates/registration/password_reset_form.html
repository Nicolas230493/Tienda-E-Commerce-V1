{% extends 'base.html' %}
{% block content %}
<section class="section">
    <div style="max-width:400px; margin:0 auto; background:white; padding:40px; border:var(--border);">
        <h2 class="section-title" style="font-size:32px; margin-bottom:20px;">Recuperar Contraseña</h2>
        <p style="font-size:14px; color:var(--muted); margin-bottom:20px;">Ingresa tu email y te enviaremos las instrucciones para crear una nueva contraseña.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-primary" style="width:100%; margin-top:20px;">Enviar Instrucciones</button>
        </form>
    </div>
</section>
{% endblock %}
